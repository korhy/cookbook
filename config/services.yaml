# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    default_admin_email: admin@clementboudinel.fr
    # Production Host allowlist for the MCP endpoint, overridable through MCP_ALLOWED_HOSTS —
    # see config/packages/mcp.yaml. A string, not a list: the csv env processor splits it.
    default_mcp_allowed_hosts: 'api.clementboudinel.fr'
    admin_email: "%env(string:default:default_admin_email:ADMIN_EMAIL)%"

    # THE canonical URI of the MCP resource server. Declared once here and injected everywhere,
    # because three things have to agree on it byte for byte or the OAuth write path fails in a
    # way that reports nothing useful:
    #   1. the RFC 9728 document's `resource` member, which clients read;
    #   2. the `aud` claim App\OAuth\AudienceStampingAccessTokenRepository stamps on every token;
    #   3. App\Security\McpTokenAudienceVerifier's RFC 8707 audience validation, which compares
    #      by *exact equality*.
    # No trailing slash, and it is the absolute URL of **/api/v1/mcp-authoring** — the protected
    # endpoint, not the public read one, because the resource identifier has to be the thing that
    # answers 401. It is the value a client sends in its `resource` parameter. The defaults live in
    # .env / .env.dev / .env.test; a real environment variable wins over all three.
    app.mcp_resource_uri: '%env(MCP_RESOURCE_URI)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\EventListener\SlugListener:
        tags:
            - name: 'doctrine.event_listener'
              event: 'prePersist'
            - name: 'doctrine.event_listener'
              event: 'preUpdate'
    App\EventListener\LocaleListener:
        tags:
            - name: 'kernel.event_listener'
              event: 'kernel.request'
              priority: 20
