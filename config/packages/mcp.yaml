mcp:
    app: 'cookbook'
    version: '1.0.0'
    # Read tools are public and unauthenticated; the two write-adjacent tools (recipe_create,
    # recipe_import_from_url) are gated by MCP_WRITE_TOKEN and refuse every call when it is unset.
    description: 'MCP server for the Cookbook API. Recipe, ingredient and category search are public and read-only; creating a recipe requires a write token and produces an unpublished draft.'

    client_transports:
        stdio: true
        http: true

    http:
        path: /mcp
        # DNS-rebinding protection: the Host header must be one of these. The default is the
        # production domain (parameter in config/services.yaml), so an unset MCP_ALLOWED_HOSTS
        # is the correct production configuration. The variable exists to reach the app on
        # another hostname — the Coolify-generated domain before the DNS cutover — without
        # editing this file; set it to a comma-separated list, and remove it afterwards.
        allowed_hosts: '%env(csv:default:default_mcp_allowed_hosts:MCP_ALLOWED_HOSTS)%'
        session:
            store: file
            directory: '%kernel.cache_dir%/mcp-sessions'
            ttl: 3600

when@dev:
    mcp:
        http:
            # cookbook_app: the container's own name on the shared `korhy_net` network, so a
            # containerised client (Radiant, another stack) is not rejected on the Host header.
            allowed_hosts: ['localhost', '127.0.0.1', 'cookbook_app']

when@test:
    mcp:
        http:
            allowed_hosts: ['localhost', '127.0.0.1']
