mcp:
    app: 'cookbook'
    version: '1.0.0'
    description: 'Public read-only MCP server exposing recipe and category search for the Cookbook API.'

    client_transports:
        stdio: true
        http: true

    http:
        path: /mcp
        allowed_hosts: ['api.clementboudinel.fr']
        session:
            store: file
            directory: '%kernel.cache_dir%/mcp-sessions'
            ttl: 3600

when@dev:
    mcp:
        http:
            # cookbook_app: the container's own name on the shared `korhy_net` network, so a
            # containerised client (Radiant, another stack) is not rejected on the Host header.
            allowed_hosts: ['localhost', '127.0.0.1', 'cookbook_app']

when@test:
    mcp:
        http:
            allowed_hosts: ['localhost', '127.0.0.1']
