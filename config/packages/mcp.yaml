mcp:
    # TWO servers, and the split is a security boundary rather than a tidy-up.
    #
    # An MCP tool error is a JSON-RPC object inside a 200 response, so a server whose tools are
    # mixed can only ever refuse a caller *in the body* — there is no way to answer `401` with a
    # `WWW-Authenticate` challenge, or `403 insufficient_scope`, for one tool and `200` for
    # another on the same URL. RFC 9728 discovery and the MCP authorization specification are both
    # built on those HTTP statuses, so the write path needs an endpoint of its own. That endpoint
    # is what `security.yaml`'s `mcp_authoring` firewall protects.
    #
    # Which tools land where is decided by the `registry:` namespace prefix below, which is why
    # src/Mcp/Tool/ is split into Read/ and Write/: the directory a tool sits in *is* its server,
    # so the two cannot drift apart, and a new tool cannot reach the public endpoint by accident.
    # The bundle fails the build on a pattern matching nothing, so neither namespace can be
    # renamed into silence.
    servers:
        # The public, unauthenticated read server. Its path, its tool names and their shapes are a
        # contract Radiant and every configured MCP client depends on — none of it moves.
        cookbook:
            version: '1.0.0'
            description: 'MCP server for the Cookbook API. Recipe, ingredient and category search, public and read-only.'

            registry:
                tools: ['App\Mcp\Tool\Read\']

            transports:
                stdio: true
                http: true

            http:
                # Explicit, and it must stay explicit: the default is `/mcp/<server name>`, which the
                # /api/v1 prefix in config/routes/mcp.yaml would turn into /api/v1/mcp/cookbook and
                # break every configured client.
                path: /mcp
                # DNS-rebinding protection: the Host header must be one of these. The default is the
                # production domain (parameter in config/services.yaml), so an unset MCP_ALLOWED_HOSTS
                # is the correct production configuration. The variable exists to reach the app on
                # another hostname — the Coolify-generated domain before the DNS cutover — without
                # editing this file; set it to a comma-separated list, and remove it afterwards.
                allowed_hosts: '%env(csv:default:default_mcp_allowed_hosts:MCP_ALLOWED_HOSTS)%'
            session:
                # `directory` is left to the bundle, which now scopes it per server
                # (%kernel.cache_dir%/mcp-sessions/<name>). Two servers may not share one store —
                # that is a compile-time error — so the per-server default is what lets a second
                # server be added without moving this one.
                store: file
                ttl: 3600

        # The authoring server: recipe_create and recipe_import_from_url, behind OAuth 2.1.
        # Reaching it takes an access token carrying the `mcp:write` scope and this server's own
        # canonical URI in `aud`. Everything recipe_create writes is still a draft.
        authoring:
            version: '1.0.0'
            description: 'Authoring server for the Cookbook API. Requires an OAuth 2.1 access token with the mcp:write scope. Created recipes are drafts, invisible to the public API until an administrator publishes them.'

            registry:
                tools: ['App\Mcp\Tool\Write\']

            transports:
                # NO STDIO, deliberately. A stdio caller arrives through a pipe with no HTTP
                # request, so there is no Authorization header, no firewall and no identity to
                # authorize, rate-limit or record in the audit trail — turning it on here would
                # publish an unauthenticated write path beside the authorized one.
                stdio: false
                http: true

            http:
                # Explicit for the same reason as above, and NOT a path *under* /mcp:
                # `access_control` matches by regex, so anything starting with `/api/v1/mcp` is
                # also matched by the `^/api/v1/mcp` PUBLIC_ACCESS rule. The rule for this path is
                # placed above that one in security.yaml, and the distinct name is the second line
                # of defence.
                #
                # This path is also THE canonical resource URI (MCP_RESOURCE_URI, reaching services
                # as the app.mcp_resource_uri parameter). McpResourceUriPathTest asserts they agree,
                # because an OAuth flow where they disagree fails with nothing useful in the logs.
                path: /mcp-authoring
                allowed_hosts: '%env(csv:default:default_mcp_allowed_hosts:MCP_ALLOWED_HOSTS)%'
            session:
                store: file
                ttl: 3600

when@dev:
    mcp:
        servers:
            cookbook:
                http:
                    # cookbook_app: the container's own name on the shared `korhy_net` network, so a
                    # containerised client (Radiant, another stack) is not rejected on the Host header.
                    allowed_hosts: ['localhost', '127.0.0.1', 'cookbook_app']
            authoring:
                http:
                    allowed_hosts: ['localhost', '127.0.0.1', 'cookbook_app']

when@test:
    mcp:
        servers:
            cookbook:
                http:
                    allowed_hosts: ['localhost', '127.0.0.1']
            authoring:
                http:
                    allowed_hosts: ['localhost', '127.0.0.1']
