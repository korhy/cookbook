monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - mcp_audit   # Audit trail for the MCP write tools — see App\Service\Mcp\McpWriteGuard

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!mcp_audit"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # The MCP write audit trail must NOT go through the fingers_crossed handler above:
            # that one buffers and discards anything below `error`, so every "write authorized" and
            # "invalid token" record would be dropped unless an unrelated error fired in the same
            # request. A dedicated always-on handler is what makes the trail an actual audit trail.
            # It writes to a file rather than php://stderr because production is OVH mutualisé,
            # where stderr is not a stream anyone reads back.
            mcp_audit:
                type: stream
                channels: [mcp_audit]
                path: "%kernel.logs_dir%/mcp_audit.log"
                level: info
                formatter: monolog.formatter.json
