monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - mcp_audit   # Audit trail for the MCP write tools — see App\Service\Mcp\McpWriteGuard

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            # Same channel and filename as production, so the audit trail exists locally too.
            # These records also reach main/dev.log; the duplication is harmless.
            mcp_audit:
                type: stream
                channels: [mcp_audit]
                path: "%kernel.logs_dir%/mcp_audit.log"
                level: info
                formatter: monolog.formatter.json

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!mcp_audit"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # php://stderr, not a file: Docker collects it and Coolify shows it in the log panel,
            # so reading a production error never requires a shell in the container.
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # The MCP write audit trail must NOT go through the fingers_crossed handler above:
            # that one buffers and discards anything below `error`, so every "write authorized" and
            # "invalid token" record would be dropped unless an unrelated error fired in the same
            # request. A dedicated always-on handler is what makes the trail an actual audit trail.
            #
            # A file, not php://stderr: the trail has to outlive the container, so /app/var/log is
            # a persistent volume in production (docs/deploy/coolify.md). Without that volume the
            # file is written and then discarded on redeploy. Do not move this to stderr.
            #
            # Nothing rotates it; the write path is token-gated and low-traffic. Read it with:
            #   jq 'select(.channel == "mcp_audit")' var/log/mcp_audit.log
            mcp_audit:
                type: stream
                channels: [mcp_audit]
                path: "%kernel.logs_dir%/mcp_audit.log"
                level: info
                formatter: monolog.formatter.json
