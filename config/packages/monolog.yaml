monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - mcp_audit   # Audit trail for the MCP write tools — see App\Service\Mcp\McpWriteGuard

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!mcp_audit"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # php://stderr, not a file: production is a container, where Docker collects the
            # process's stderr and Coolify shows it in the log panel. A file under var/log
            # would instead be invisible from outside and discarded with the container on
            # every redeployment.
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # The MCP write audit trail must NOT go through the fingers_crossed handler above:
            # that one buffers and discards anything below `error`, so every "write authorized" and
            # "invalid token" record would be dropped unless an unrelated error fired in the same
            # request. A dedicated always-on handler is what makes the trail an actual audit trail.
            # It writes to php://stderr like the others: the trail is read in the Coolify log
            # panel, which also means there is no unbounded file to rotate — the former
            # var/log/mcp_audit.log was purged by nothing. The trade-off is accepted: the
            # retained history is whatever Docker keeps.
            # Filter it out of the rest with: | json | channel = "mcp_audit"
            mcp_audit:
                type: stream
                channels: [mcp_audit]
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
