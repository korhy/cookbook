framework:
    rate_limiter:
        # Successful writes, keyed on the token fingerprint. Bounds the damage a leaked
        # MCP_WRITE_TOKEN can do before it is rotated.
        mcp_write:
            policy: 'sliding_window'
            limit: 20
            interval: '1 hour'

        # Outbound fetches for recipe_import_from_url. Separate from mcp_write so that importing a
        # page does not eat the budget for creating the recipe it produced.
        mcp_import:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'

        # Failed authentication attempts, keyed on the caller's IP. Only consumed on failure, so a
        # legitimate client's writes never exhaust it — this exists purely to blunt token guessing.
        mcp_write_auth:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'

# The limiter semantics are covered by McpWriteGuardTest, which builds its own limiters with
# explicit limits and in-memory storage. Production limits here would only make integration tests
# order-dependent and flaky, since the cache-backed window survives between test methods.
when@test:
    framework:
        rate_limiter:
            mcp_write:
                policy: 'sliding_window'
                limit: 10000
                interval: '1 hour'
            mcp_import:
                policy: 'sliding_window'
                limit: 10000
                interval: '1 hour'
            mcp_write_auth:
                policy: 'sliding_window'
                limit: 10000
                interval: '1 hour'
