security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\Admin
                property: username
        # used to reload user from session & other features (e.g. switch_user)

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # The OAuth endpoints a client must reach with NO session and NO user. `security: false`
        # rather than a PUBLIC_ACCESS access_control rule, because it also removes the firewall's
        # entry point: nothing can turn these into a 302 to the login form. A client whose access
        # token expired has to be able to re-discover the server and exchange its refresh token
        # unauthenticated — if /oauth2/token answered with a redirect, it could never recover.
        # /.well-known/* is listed here ahead of the metadata documents (RFC 9728 / RFC 8414)
        # that land in the next phase; nothing serves those paths yet.
        oauth2_public:
            pattern: ^/(oauth2/token|\.well-known/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
        admin:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true
    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/docs,      roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/mcp,       roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_ADMIN }
        # The resource owner is the single Admin account, so the authorization endpoint just
        # needs *a* logged-in user: an unauthenticated /oauth2/authorize hits the admin
        # firewall's form_login entry point, lands on app_login, and Symfony returns to the
        # saved target path afterwards. No login UI of our own to write.
        # REMEMBERED (not FULLY) so the remember-me cookie the admin firewall issues counts.
        # /oauth2/token and /.well-known/* never reach this map — the oauth2_public firewall
        # above takes them out of security entirely.
        - { path: ^/oauth2/authorize, roles: IS_AUTHENTICATED_REMEMBERED }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
