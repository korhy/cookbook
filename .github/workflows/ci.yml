name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ghcr.io: the production image registry. Coolify pulls from here.
env:
  REGISTRY: ghcr.io

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pgsql, intl, mbstring
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --overwrite
        env:
          APP_ENV: test
          JWT_PASSPHRASE: test

      # The OAuth authorization server's keypair, separate from Lexik's above. Any test that
      # reaches /oauth2/token instantiates league's AuthorizationServer, which reads the private
      # key from disk in its constructor — so a fresh checkout needs this before PHPUnit runs.
      - name: Generate OAuth keys
        run: php bin/console league:oauth2-server:generate-keypair --overwrite
        env:
          APP_ENV: test
          OAUTH_PASSPHRASE: test

      - name: Setup test database
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
        env:
          APP_ENV: test
          DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8"

      - name: PHPUnit
        run: php bin/phpunit
        env:
          APP_ENV: test
          DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8"
          JWT_PASSPHRASE: test
          # Must match the passphrase the keypair was generated with two steps up, for the same
          # reason as JWT_PASSPHRASE: the passphrase is baked into the private key, so a mismatch
          # fails every OAuth test with an opaque key-loading error. CI can pin both because it
          # generates both pairs fresh; the Make targets deliberately do not (see testing.md).
          OAUTH_PASSPHRASE: test

  # ─── Continuous deployment ────────────────────────────────────────────────
  # Build & push the production FrankenPHP image to GHCR, tagged `latest` and the
  # commit SHA. Runs ONLY on push to main and ONLY once `ci` is green, so a broken
  # commit never produces a new `latest`. Coolify PULLS this image — it does not
  # build it — see docs/deploy/coolify.md.
  build-images:
    name: Build & Push Image (GHCR)
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frankenphp
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # Built locally first so the audit below can run against the real production
      # image, before anything is published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frankenphp/Dockerfile.prod
          load: true
          tags: cookbook-prod:audit
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gate the test suite cannot be: PHPUnit runs with dev dependencies
      # installed, so a class from require-dev used in src/ passes every test and
      # only fails in production, at runtime. That is exactly how DomCrawler broke
      # recipe_import_from_url. Here each class src/ imports must resolve against
      # the --no-dev autoloader, or `latest` is never published.
      #
      # Aliased imports are skipped: `use Doctrine\ORM\Mapping as ORM;` imports a
      # namespace, not a class, so it can never resolve as one. That costs a little
      # coverage and buys no false failures — the alternative is a check nobody
      # trusts. 234 of 246 imports are covered today.
      - name: Every class src/ imports must resolve without dev dependencies
        run: |
          grep -rhE '^use ' src/ \
            | grep -vE '^use (function|const) ' \
            | grep -v ' as ' \
            | sed -E 's/^use //; s/;$//' \
            | sort -u \
            | docker run --rm -i --entrypoint php cookbook-prod:audit -r '
                require "/app/vendor/autoload.php";
                $missing = [];
                $n = 0;
                while (($l = fgets(STDIN)) !== false) {
                    $l = trim($l);
                    if ($l === "") continue;
                    $n++;
                    if (!class_exists($l) && !interface_exists($l) && !trait_exists($l) && !enum_exists($l)) {
                        $missing[] = $l;
                    }
                }
                printf("%d classes checked against the production autoloader%s", $n, PHP_EOL);
                if ($missing !== []) {
                    echo "Missing in --no-dev — move the package to composer require:", PHP_EOL;
                    foreach ($missing as $m) { echo "  - ", $m, PHP_EOL; }
                    exit(1);
                }
                echo "all resolved", PHP_EOL;
              '

      # The audit above only sees classes src/ names in a `use`. It is blind to a
      # dependency resolved inside another package — DomCrawler::filter() needs
      # symfony/css-selector, which src/ never imports, and that shipped broken too.
      # So exercise the path instead of inspecting it.
      - name: The import path must work without dev dependencies
        run: |
          docker run --rm --entrypoint php cookbook-prod:audit -r '
            require "/app/vendor/autoload.php";
            $c = new Symfony\Component\DomCrawler\Crawler("<html><body><script type=\"application/ld+json\">{}</script></body></html>");
            $n = $c->filter("script[type=\"application/ld+json\"]")->count();
            if ($n !== 1) { echo "CSS filtering returned $n, expected 1", PHP_EOL; exit(1); }
            echo "DomCrawler CSS filtering works in --no-dev", PHP_EOL;
          '

      # Same build, now from cache, so this only uploads layers.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frankenphp/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
