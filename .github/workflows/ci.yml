name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ghcr.io: the production image registry. Coolify pulls from here.
env:
  REGISTRY: ghcr.io

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pgsql, intl, mbstring
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --overwrite
        env:
          APP_ENV: test
          JWT_PASSPHRASE: test

      - name: Setup test database
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
        env:
          APP_ENV: test
          DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8"

      - name: PHPUnit
        run: php bin/phpunit
        env:
          APP_ENV: test
          DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8"
          JWT_PASSPHRASE: test

  # ─── Continuous deployment ────────────────────────────────────────────────
  # Build & push the production FrankenPHP image to GHCR, tagged `latest` and the
  # commit SHA. Runs ONLY on push to main and ONLY once `ci` is green, so a broken
  # commit never produces a new `latest`. Coolify PULLS this image — it does not
  # build it — see docs/deploy/coolify.md.
  build-images:
    name: Build & Push Image (GHCR)
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frankenphp
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frankenphp/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
