name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Without this the script keeps running after a failed command and the action reports the
            # exit code of the LAST one, so a broken cache rebuild deployed silently.
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git checkout main
            git checkout -- config/reference.php
            git pull origin main
            # --no-scripts is load-bearing. composer's post-install-cmd runs @auto-scripts, whose
            # first entry is a plain `cache:clear` — the exact command the steps below exist to
            # avoid, because it clears and then warms into an empty directory and trips
            # DoctrineMetadataCacheWarmer every time. Without set -e that failure was swallowed;
            # with it, the deploy aborts here and every step after it is skipped.
            APP_ENV=prod php composer.phar install --no-dev --optimize-autoloader --no-scripts
            # The prod container is compiled once and never freshness-checked, so a release that
            # deletes a service leaves bin/console booting a container that references a class
            # which is no longer there. Removing the directory outright is the only thing that
            # cannot trip over the stale container on its way to replacing it.
            rm -rf var/cache/prod
            APP_ENV=prod php bin/console doctrine:migrations:migrate --no-interaction
            # The three @auto-scripts entries, run explicitly and in an order that works.
            # assets/vendor/ and public/assets/ are git-ignored, so importmap:install and
            # asset-map:compile are not optional on the server.
            APP_ENV=prod php bin/console assets:install
            APP_ENV=prod php bin/console importmap:install
            APP_ENV=prod php bin/console asset-map:compile
            # Never a plain `cache:warmup`: --no-optional-warmers is what keeps
            # DoctrineMetadataCacheWarmer out of it. The rest is built lazily on first request.
            APP_ENV=prod php bin/console cache:warmup --no-optional-warmers
